# Тесты на PR в main и при push в main. При push в main деплой не запускается из этого файла (см. deploy-selfhosted.yml с needs).
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gophkeeper2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go mod tidy
        run: go mod tidy

      - name: Run migrations
        run: go run ./cmd/migrate/
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gophkeeper2_test?sslmode=disable

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v -race -count=1 ./...
