# Деплой на self-hosted runner (тот же сервер). Запускается при push в main.
# Тесты при push в main выполняются в workflow test.yml; этот workflow можно вызывать после успешных тестов
# (настройка: Branch protection rule — Require status "Test" to pass before merging; тогда деплой после merge уже защищён).
# Либо один workflow с job test + job deploy (needs: test) — тогда при push в main сначала тесты, потом деплой.
name: Deploy (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # При push в main сначала прогоняем тесты, деплой только при успехе
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gophkeeper2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod tidy
      - run: go run ./cmd/migrate/
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gophkeeper2_test?sslmode=disable
      - run: go vet ./...
      - run: go test -v -race -count=1 ./...

  deploy:
    runs-on: [self-hosted, linux]
    needs: [test]
    # При push в main — деплой только если тесты прошли; при workflow_dispatch тесты пропускаются (skipped) — деплой всё равно выполняется
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      PROJECT_DIR: /opt/gophkeeper2/gophkeeper2

    steps:
      - name: Deploy to server
        run: |
          set -e
          cd "$PROJECT_DIR"
          git fetch origin
          git reset --hard origin/main

          go build -o gophkeeper2 ./cmd/server
          go build -o migrate ./cmd/migrate

          # .env для прод (секреты подставляются из GitHub Secrets)
          cat > .env << 'ENVEOF'
          PORT=8083
          LOG_LEVEL=info
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TLS_ENABLED=false
          ENVEOF

          # .env.test для тестового окружения (порт 8084)
          cat > .env.test << 'ENVEOF'
          PORT=8084
          LOG_LEVEL=info
          DATABASE_URL=${{ secrets.DATABASE_URL_TEST }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TLS_ENABLED=false
          ENVEOF

          sudo systemctl restart gophkeeper2 || true
          sudo systemctl restart gophkeeper2-test || true

          sleep 2
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8083/health | grep -q 200 || (echo "Health check failed"; exit 1)
