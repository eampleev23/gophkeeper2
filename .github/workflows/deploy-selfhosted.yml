# Только деплой на self-hosted runner. Тесты — локально (pre-commit).
name: Deploy (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    env:
      PROJECT_DIR: /opt/gophkeeper2/gophkeeper2

    steps:
      - name: Deploy to server
        run: |
          set -e
          export PATH="/usr/local/go/bin:$PATH"
          git config --global --add safe.directory "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          git fetch origin
          git reset --hard origin/main

          go build -o gophkeeper2 ./cmd/server
          go build -o migrate ./cmd/migrate

          # .env для прод (секреты подставляются из GitHub Secrets)
          cat > .env << 'ENVEOF'
          PORT=8083
          LOG_LEVEL=info
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TLS_ENABLED=false
          ENVEOF

          # .env.test для тестового окружения (порт 8084)
          cat > .env.test << 'ENVEOF'
          PORT=8084
          LOG_LEVEL=info
          DATABASE_URL=${{ secrets.DATABASE_URL_TEST }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TLS_ENABLED=false
          ENVEOF

          sudo systemctl restart gophkeeper2 || true
          sudo systemctl restart gophkeeper2-test || true

          sleep 2
          curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8083/health | grep -q 200 || (echo "Health check failed"; exit 1)
